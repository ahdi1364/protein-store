<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5f1">
<meta name="description" content="فروشگاه پروتئین ایلیا؛ تازه‌ترین محصولات لبنی، پروتئینی و مواد غذایی.">
<title>پروتئین ایلیا | خرید محصولات غذایی</title>
<style>
  :root {
    --bg: #f7f5f1;
    --card: #ffffff;
    --text: #222;
    --muted: #777;
    --accent: #e0662b;
    --accent-dark: #c4511a;
    --border: #e6e2da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 18px 16px 14px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; font-size: 14px; opacity: .95; }
  .search-wrap { padding: 14px 16px 6px; }
  #search {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    font-family: inherit;
  }
  .cats {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 8px 16px 12px;
    scrollbar-width: none;
  }
  .cats button {
    flex: 0 0 auto;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }
  .cats button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  main { padding: 4px 16px 40px; }
  .group { margin-bottom: 22px; }
  .group h2 {
    font-size: 17px;
    margin: 10px 0;
    color: var(--accent-dark);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
    font-size: 15px;
  }
  .item .price {
    display: block;
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .note {
    text-align: center;
    background: #fff;
    border: 1px dashed var(--accent);
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    margin-top: 10px;
  }
  .order {
    position: sticky;
    bottom: 0;
    background: #fff;
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    text-align: center;
  }
  .order a {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 16px;
  }
  .hidden { display: none !important; }
  @media (min-width: 700px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>

<header>
  <h1>پروتئین ایلیا</h1>
  <p>تازه‌ترین محصولات لبنی، پروتئینی و مواد غذایی</p>
</header>

<div class="search-wrap">
  <input id="search" type="search" placeholder="جستجوی محصول... (مثلاً: شیر، پنیر، ماست)">
</div>

<div class="cats" id="cats"></div>

<main id="list"></main>

<div class="order">
  <a id="orderBtn" href="#">سفارش از طریق تماس</a>
</div>

<script>
  // ===== تنظیمات: بعداً این دو مورد را عوض کنید =====
  const PHONE = "09000000000";       // شماره تماس
  const ORDER_LINK = "tel:" + PHONE; // بعداً می‌توانید به لینک واتساپ یا تلگرام تغییر دهید

  // ===== لیست محصولات (قیمت‌ها بعداً اضافه می‌شوند) =====
  const DATA = [
    { cat: "لبنیات", items: ["شیر", "ماست", "پنیر", "خامه"] },
    { cat: "سوسیس و فرآوری", items: ["سوسیس", "کالباس", "ناگت", "شنسل"] },
    { cat: "پیتزا و فست‌فود", items: ["خمیر پیتزا", "پنیر پیتزا", "همبرگر"] },
    { cat: "نوشیدنی", items: ["نوشابه", "دلستر", "آب‌میوه", "آب معدنی"] },
    { cat: "دسر", items: ["بستنی شکلات"] },
    { cat: "ترشیجات و رب", items: ["رب", "ماکارونی", "ترشی", "خیارشور", "زیتون"] },
    { cat: "نوشیدنی گرم", items: ["چای", "نسکافه", "قهوه", "مولتی کافه"] },
    { cat: "کنسرو", items: ["تن ماهی", "انواع کنسرو"] }
  ];

  const ALL = "همه";
  const listEl = document.getElementById("list");
  const catsEl = document.getElementById("cats");
  const searchEl = document.getElementById("search");
  let activeCat = ALL;

  document.getElementById("orderBtn").href = ORDER_LINK;

  function renderCats() {
    const names = [ALL, ...DATA.map(g => g.cat)];
    catsEl.innerHTML = "";
    names.forEach(name => {
      const b = document.createElement("button");
      b.textContent = name;
      if (name === activeCat) b.classList.add("active");
      b.onclick = () => { activeCat = name; renderCats(); render(); };
      catsEl.appendChild(b);
    });
  }

  function render() {
    const q = searchEl.value.trim();
    listEl.innerHTML = "";
    DATA.forEach(group => {
      if (activeCat !== ALL && group.cat !== activeCat) return;
      const items = group.items.filter(name => !q || name.includes(q));
      if (items.length === 0) return;

      const sec = document.createElement("section");
      sec.className = "group";
      sec.innerHTML = `<h2>${group.cat}</h2>`;
      const grid = document.createElement("div");
      grid.className = "grid";
      items.forEach(name => {
        const d = document.createElement("div");
        d.className = "item";
        d.innerHTML = `${name}<span class="price">قیمت به زودی</span>`;
        grid.appendChild(d);
      });
      sec.appendChild(grid);
      listEl.appendChild(sec);
    });

    if (!listEl.children.length) {
      listEl.innerHTML = `<div class="note">محصولی پیدا نشد.</div>`;
    } else if (!q && activeCat === ALL) {
      listEl.innerHTML += `<div class="note">و هزاران آیتم دیگر. برای سفارش، با ما تماس بگیرید.</div>`;
    }
  }

  searchEl.addEventListener("input", render);
  renderCats();
  render();
</script>

</body>
</html>
